<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RaceGuard Review Console</title>
  <style>
    :root{color-scheme:dark;--ink:#f6f7ef;--muted:#aeb8ad;--panel:#17211e;--edge:#30433c;--accent:#d9ff65;--warn:#ffb45d;--danger:#ff775f}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#0b1210;color:var(--ink)}main{width:min(1000px,92vw);margin:4rem auto}header{display:flex;justify-content:space-between;gap:2rem;align-items:end}h1{font-size:clamp(2.5rem,7vw,5rem);line-height:.9;margin:0;letter-spacing:-.06em}h1 span,.score,a{color:var(--accent)}.tag{color:var(--muted);max-width:32rem}.upload{margin:3rem 0;padding:2rem;border:1px solid var(--edge);background:var(--panel);border-radius:18px}input,button{font:inherit}input[type=file],input[type=text]{width:100%;padding:1rem;border:1px dashed #60776e;border-radius:10px;background:#0b1210;color:var(--ink);margin-top:.7rem}button{margin-top:1rem;border:0;border-radius:999px;padding:.8rem 1.4rem;background:var(--accent);color:#111;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.notice{color:var(--warn)}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem}.metric,.card{border:1px solid var(--edge);background:var(--panel);padding:1.25rem;border-radius:14px}.metric strong{display:block;font-size:2rem}.metric.alert strong{color:var(--danger)}.card{margin:1rem 0}.score{font-size:1.5rem;font-weight:800}dl{display:grid;grid-template-columns:1fr 1fr;gap:.4rem 1rem}dt{color:var(--muted)}dd{margin:0;text-align:right}#status{min-height:1.5rem}#fit-fields[hidden]{display:none}@media(max-width:650px){header{display:block}dl{grid-template-columns:1fr}dd{text-align:left;margin-bottom:.5rem}}
  </style>
</head><body><main>
  <header><h1>Race<span>Guard</span></h1><p class="tag">Local telemetry screening for race officials. Files are analyzed by the native RaceGuard model and are not stored.</p></header>
  <form class="upload" id="upload">
    <label for="file"><strong>Analyze race telemetry</strong><br><small>Choose a multi-rider CSV or a single-rider FIT activity (25 MB maximum).</small></label>
    <input id="file" name="file" type="file" accept=".csv,.fit" required>
    <label id="fit-fields" hidden>Rider ID for FIT activity<input id="rider-id" name="rider_id" type="text" autocomplete="off" placeholder="e.g. 142"></label>
    <button>Run screening</button><p id="status" role="status" aria-live="polite"></p>
  </form>
  <section id="results" hidden><p class="notice">Screening result only. Review conditions, observations, footage, and source telemetry before reaching a conclusion.</p><div class="summary" id="summary"></div><div id="warnings"></div><div id="segments"></div></section>
</main><script>
const form=document.querySelector('#upload'),file=document.querySelector('#file'),rider=document.querySelector('#rider-id'),fitFields=document.querySelector('#fit-fields'),status=document.querySelector('#status'),results=document.querySelector('#results');
file.addEventListener('change',()=>{const isFit=file.files[0]?.name.toLowerCase().endsWith('.fit');fitFields.hidden=!isFit;rider.required=Boolean(isFit)});
form.addEventListener('submit',async event=>{event.preventDefault();status.textContent='Analyzing telemetry…';results.hidden=true;const button=form.querySelector('button');button.disabled=true;try{const body=new FormData(form);if(fitFields.hidden)body.delete('rider_id');const response=await fetch('/api/analyze',{method:'POST',body}),data=await response.json();if(!response.ok)throw new Error(data.detail||'Analysis failed');render(data);status.textContent='Analysis complete.'}catch(error){status.textContent=error instanceof Error?error.message:'Analysis failed'}finally{button.disabled=false}});
function render(data){const s=data.summary,confidence=Math.round(s.confidence*100),assessment=s.is_suspicious?'Review recommended':'No flags detected';document.querySelector('#summary').innerHTML=`<div class="metric ${s.is_suspicious?'alert':''}"><strong>${escapeHtml(assessment)}</strong>assessment</div><div class="metric"><strong>${confidence}%</strong>confidence score</div><div class="metric"><strong>${s.points_analyzed}</strong>points analyzed</div><div class="metric"><strong>${s.segments_for_review}</strong>review locations</div>`;document.querySelector('#warnings').innerHTML=data.warnings.map(w=>`<p class="notice">${escapeHtml(w)}</p>`).join('');document.querySelector('#segments').innerHTML=data.segments.length?data.segments.map(x=>{const lat=Number(x.latitude),lon=Number(x.longitude),hasLocation=Number.isFinite(lat)&&Number.isFinite(lon),map=hasLocation?`<a href="https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}#map=17/${lat}/${lon}" target="_blank" rel="noopener">${lat.toFixed(6)}, ${lon.toFixed(6)}</a>`:'Unavailable',distance=x.course_distance_m==null?'':` · ${(x.course_distance_m/1000).toFixed(2)} km into activity`;return `<article class="card"><div class="score">${Math.round(x.score*100)}% confidence</div><h2>Rider ${escapeHtml(x.rider_id)}</h2><dl><dt>Time window</dt><dd>${formatTime(x.start_time)}–${formatTime(x.end_time)}</dd><dt>Location</dt><dd>${map}${distance}</dd><dt>Nearest rider</dt><dd>${escapeHtml(x.nearest_rider_id||'Unavailable')}</dd><dt>Mean separation</dt><dd>${formatValue(x.average_separation_m,'m')}</dd><dt>Mean speed</dt><dd>${formatValue(x.average_speed_mps==null?null:x.average_speed_mps*3.6,'km/h')}</dd><dt>Measured / expected power</dt><dd>${formatValue(x.average_power_w,'W')} / ${formatValue(x.expected_power_w,'W')}</dd></dl><p>${x.evidence.notes.map(escapeHtml).join(' ')}</p></article>`}).join(''):'<article class="card"><h2>No segments crossed the review threshold</h2><p>The supplied telemetry did not contain enough evidence for a flag; this is not proof that no violation occurred.</p></article>';results.hidden=false}
function formatTime(value){return new Date(value).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}function formatValue(value,unit){return value==null?'Unavailable':`${Number(value).toFixed(1)} ${unit}`}function escapeHtml(value){const node=document.createElement('span');node.textContent=String(value);return node.innerHTML}
</script></body></html>
