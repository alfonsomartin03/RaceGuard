<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RaceGuard Review Console</title>
  <style>
    :root { color-scheme: dark; --ink:#f6f7ef; --muted:#aeb8ad; --panel:#17211e; --edge:#30433c; --accent:#d9ff65; --warn:#ffb45d; }
    * { box-sizing:border-box; } body { margin:0; font:16px/1.5 system-ui,sans-serif; background:#0b1210; color:var(--ink); }
    main { width:min(1000px,92vw); margin:4rem auto; } header { display:flex; justify-content:space-between; gap:2rem; align-items:end; }
    h1 { font-size:clamp(2.5rem,7vw,5rem); line-height:.9; margin:0; letter-spacing:-.06em; } h1 span { color:var(--accent); }
    .tag { color:var(--muted); max-width:32rem; } .upload { margin:3rem 0; padding:2rem; border:1px solid var(--edge); background:var(--panel); border-radius:18px; }
    input,button { font:inherit; } input[type=file] { width:100%; padding:1rem; border:1px dashed #60776e; border-radius:10px; }
    button { margin-top:1rem; border:0; border-radius:999px; padding:.8rem 1.4rem; background:var(--accent); color:#111; font-weight:800; cursor:pointer; }
    button:disabled { opacity:.5; } .notice { color:var(--warn); } .summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1rem; }
    .metric,.card { border:1px solid var(--edge); background:var(--panel); padding:1.25rem; border-radius:14px; } .metric strong { display:block; font-size:2rem; }
    .card { margin:1rem 0; } .score { color:var(--accent); font-size:1.5rem; font-weight:800; } dl { display:grid; grid-template-columns:1fr 1fr; gap:.4rem 1rem; }
    dt { color:var(--muted); } dd { margin:0; text-align:right; } #status { min-height:1.5rem; }
    @media (max-width:650px) { header { display:block; } dl { grid-template-columns:1fr; } dd { text-align:left; margin-bottom:.5rem; } }
  </style>
</head>
<body><main>
  <header><h1>Race<span>Guard</span></h1><p class="tag">Telemetry screening for race officials. Flags identify where to look; they never determine whether a violation occurred.</p></header>
  <form class="upload" id="upload"><label for="file"><strong>Analyze race telemetry</strong><br><small>Choose a CSV containing one or more riders.</small></label><input id="file" name="file" type="file" accept=".csv,.fit" required><button>Run screening</button><p id="status"></p></form>
  <section id="results" hidden><p class="notice">Screening result only. Review source telemetry, conditions, observations, and footage before reaching any conclusion.</p><div class="summary" id="summary"></div><div id="segments"></div></section>
</main><script>
const form=document.querySelector('#upload'),status=document.querySelector('#status'),results=document.querySelector('#results');
form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Analyzing telemetry…';results.hidden=true;const button=form.querySelector('button');button.disabled=true;
try{const response=await fetch('/api/analyze',{method:'POST',body:new FormData(form)}),data=await response.json();if(!response.ok)throw new Error(data.detail||'Analysis failed');render(data);status.textContent='Analysis complete.';}catch(error){status.textContent=error.message;}finally{button.disabled=false;}});
function render(data){const s=data.summary;document.querySelector('#summary').innerHTML=`<div class="metric"><strong>${s.points_analyzed}</strong>points</div><div class="metric"><strong>${s.riders_analyzed.length}</strong>riders</div><div class="metric"><strong>${s.segments_for_review}</strong>review flags</div>`;
document.querySelector('#segments').innerHTML=data.segments.length?data.segments.map((x,i)=>`<article class="card"><div class="score">${Math.round(x.score*100)}% review priority</div><h2>Rider ${escapeHtml(x.rider_id)}</h2><dl><dt>Window</dt><dd>${new Date(x.start_time).toLocaleTimeString()}–${new Date(x.end_time).toLocaleTimeString()}</dd><dt>Nearest rider</dt><dd>${escapeHtml(x.nearest_rider_id||'Unavailable')}</dd><dt>Mean separation</dt><dd>${x.average_separation_m??'—'} m</dd><dt>Mean speed</dt><dd>${(x.average_speed_mps*3.6).toFixed(1)} km/h</dd><dt>Measured / expected power</dt><dd>${x.average_power_w??'—'} / ${x.expected_power_w??'—'} W</dd></dl><p>${x.evidence.notes.map(escapeHtml).join(' ')}</p></article>`).join(''):'<article class="card"><h2>No segments crossed the review threshold</h2><p>This does not prove that no violation occurred.</p></article>';results.hidden=false;}
function escapeHtml(value){const node=document.createElement('span');node.textContent=String(value);return node.innerHTML;}
</script></body></html>
